name: 功能请求
description: 提议新能力或改进（请说明原生小程序场景下的必要性）
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        本库只面向原生微信小程序，零运行时依赖；新增能力需要先确认它确实要在宿主侧实现。
        请先阅读 [docs/](https://github.com/unitseek/tallystore/tree/main/docs) 与
        [skills/tallystore](https://github.com/unitseek/tallystore/tree/main/skills/tallystore)，
        避免与现有能力重复（与 Bug 模板保持一致）。
        功能请求按「建议」分级；分级定义、响应目标与 EOL/复盘要求见
        [docs/ISSUE-TRIAGE.md](https://github.com/unitseek/tallystore/blob/main/docs/ISSUE-TRIAGE.md)。
  - type: dropdown
    id: severity
    attributes:
      label: 问题分级（功能请求默认「建议」）
      description: 建议=改进 / 新能力 / 文档；5 个工作日内确认收到，不承诺修复时间（见 docs/ISSUE-TRIAGE）
      options:
        - 'suggestion — 建议：改进 / 新能力 / 文档 / 体验（5 个工作日确认收到）'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么页面 / 组件 / App 场景下遇到什么问题？当前写法为什么不够用？
      placeholder: 场景、现状、痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 期望的 API、配置或行为；如涉及默认值请一并说明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 业务侧能否自行实现？为什么不在上层解决？
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前自查
      options:
        - label: 我已阅读 docs/ 与 skills/tallystore，确认现有能力无法满足
          required: true
        - label: 该能力确实需要在原生小程序宿主内实现，而不是业务代码或打包器侧
          required: true
